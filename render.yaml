# Render Blueprint for the Express API (the Next.js client deploys to Vercel).
# Secrets are `sync: false`: Render prompts for them when the Blueprint is created.
services:
  - type: web
    name: bookleaf-api
    runtime: node
    plan: free
    # Closest Render region to India; put the Atlas cluster nearby (e.g. AWS ap-southeast-1 or ap-south-1).
    region: singapore
    # --include=dev: NODE_ENV=production would otherwise skip TypeScript, which the
    # root postinstall needs to build @bookleaf/shared and the server build needs for tsc.
    buildCommand: npm ci --include=dev && npm run build -w server
    startCommand: npm start -w server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Browser → Vercel rewrite → Render proxy → app: two hops to trust for the client IP.
      - key: TRUST_PROXY
        value: "2"
      # Several graders may log in from one network; still rate-limited per IP.
      - key: LOGIN_RATE_LIMIT_MAX
        value: "30"
      - key: MONGODB_URI
        sync: false
      # Must be identical to JWT_SECRET in the Vercel project.
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # The Vercel URL, e.g. https://bookleaf.vercel.app (Socket.IO + CORS allow-list).
      - key: CLIENT_ORIGIN
        sync: false
      # This service's own public URL, e.g. https://bookleaf-api.onrender.com
      - key: SOCKET_PUBLIC_URL
        sync: false
